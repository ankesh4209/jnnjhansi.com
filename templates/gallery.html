<div>
  <div style="margin-bottom: 24px;">
    <h2 style="font-size: 24px; font-weight: 800; color: var(--primary); margin: 0 0 6px 0;">
      Photo Gallery
    </h2>
    <p style="color: var(--text-muted); font-size: 14px; margin: 0;">
      Glimpses of Jhansi city heritage, municipal development projects, civic events, and smart city works.
    </p>
  </div>

  <div id="gallery" style="background:#FFFFFF; padding:0; width:100%;">
    <style>
      #gallery table { width: 100% !important; border-collapse: separate; border-spacing: 14px; }
      #gallery td { vertical-align: middle; background: #FAFCFE; border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 12px; transition: var(--transition); }
      #gallery td:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); border-color: #BFDBFE; }
      #gallery img { border: none !important; border-radius: var(--radius-sm); margin: 0 auto; }
      #gallery ul { list-style: none; margin: 0; padding: 0; }
      #gallery li { display: block; margin: 0; padding: 0; }
    </style>
    <ul>
      __pagecontent__
    </ul>
  </div>
</div>
