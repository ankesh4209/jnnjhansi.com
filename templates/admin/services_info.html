<script language="javascript">
function selectAll() {
  var frm = document.services_form;
  for (var i = 0; i < frm.elements.length; i++) {
    if (frm.elements[i].type == 'checkbox') frm.elements[i].checked = true;
  }
}
function selectNone() {
  var frm = document.services_form;
  for (var i = 0; i < frm.elements.length; i++) {
    if (frm.elements[i].type == 'checkbox') frm.elements[i].checked = false;
  }
}
function checkSelected() {
  var frm = document.services_form;
  for (var i = 0; i < frm.elements.length; i++) {
    if (frm.elements[i].type == 'checkbox' && frm.elements[i].checked) return true;
  }
  alert("Please select at least one item.");
  return false;
}
function confirmDelete() {
  if (checkSelected()) {
    return confirm("The selected services will be deleted. Are you sure?");
  }
  return false;
}
</script>
